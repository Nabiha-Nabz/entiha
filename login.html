<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Entiha</title>
    <link rel="icon" type="image/png" sizes="512x512" href="images/tilo.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="luxury-theme auth-page">
    <!-- Background -->
    <div class="elegant-bg"></div>

    <nav class="luxury-nav">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">Entiha</a>
            </div>
            <div class="nav-links">
                <a href="signup.html" class="btn btn-outline">Sign Up</a>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="auth-container">
            <div class="auth-card glass animate-fade-in">
                <div class="signup-header">
                    <h1 class="signup-title">Welcome Back</h1>
                    <p class="signup-subtitle">Sign in to your account to continue your journey</p>
                </div>
                
                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" class="enhanced-input" placeholder="Enter your email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="enhanced-input" placeholder="Enter your password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-full">
                        Sign In
                    </button>
                </form>
                
                <div class="login-links">
                    <a href="#" class="login-link" id="forgotPasswordLink">
                        Forgot your password?
                    </a>
                    <a href="signup.html" class="login-link">
                        Don't have an account? Create one here
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgotPasswordModal" class="modal" style="display: none;">
        <div class="modal-content glass">
            <button class="close-modal" id="closeForgotPassword">&times;</button>
            <h3 class="form-section-title">Reset Your Password</h3>
            <form id="forgotPasswordForm" class="auth-form">
                <div class="form-group">
                    <label for="resetEmail" class="form-label">Email Address</label>
                    <input type="email" id="resetEmail" class="enhanced-input" placeholder="Enter your email" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Send Reset Link</button>
                    <button type="button" class="btn btn-prev" id="cancelForgotPassword">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/animations.js"></script>
</body>
</html>
